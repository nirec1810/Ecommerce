
# Configuración general de Spring
spring.application.name=customer-service

# Configuración de la fuente de datos (DataSource)
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/customer_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración del puerto del servidor
server.port=8081

# Conexión al servidor Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:host.docker.internal}:8761/eureka/
# application.properties para Clientes de Admin
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Configuración del nivel de logging
logging.level.io.reactiveprogramming=DEBUG
spring.cloud.compatibility-verifier.enabled=false
keycloak.base-uri=${KEYCLOAK_SERVER:http://host.docker.internal:8091/realms/ecommerce/protocol/openid-connect/}