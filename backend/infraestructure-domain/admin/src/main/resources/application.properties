spring.application.name=admin
server.port=9090

# Registrar Admin Server en Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:host.docker.internal}:8761/eureka/
spring.cloud.compatibility-verifier.enabled=false
keycloak.base-uri=${KEYCLOAK_SERVER:http://host.docker.internal:8091/realms/ecommerce/protocol/openid-connect/}